name: Build and Publish Docker Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Lowercase image name
        id: vars
        run: |
          echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"
          # Example: platform=linux/amd64 -> platform_pair=linux-amd64
          platform='${{ matrix.platform }}'
          echo "platform_pair=${platform//\//-}" >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.vars.outputs.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
    steps:
      - name: Lowercase image name
        id: vars
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest and tags
        run: |
          set -euo pipefail
          shopt -s nullglob

          image='${{ steps.vars.outputs.image }}'
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done

          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "No digest files found in $(pwd)"
            ls -la
            exit 1
          fi

          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            version='${{ github.ref_name }}'
            target_tag="$version"
            docker buildx imagetools create \
              -t "$image:$version" \
              -t "$image:latest" \
              "${sources[@]}"
          else
            branch='${{ github.ref_name }}'
            target_tag="$branch"
            docker buildx imagetools create \
              -t "$image:$branch" \
              "${sources[@]}"
          fi

          docker buildx imagetools inspect "$image:$target_tag"
        working-directory: ${{ runner.temp }}/digests
