name: Build and Publish Docker Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KEEP_UNTAGGED_COUNT: 3

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Lowercase image name
        id: vars
        run: |
          echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"
          # Example: platform=linux/amd64 -> platform_pair=linux-amd64
          platform='${{ matrix.platform }}'
          echo "platform_pair=${platform//\//-}" >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.vars.outputs.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
    steps:
      - name: Lowercase image name
        id: vars
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest and tags
        run: |
          image='${{ steps.vars.outputs.image }}'
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            version='${{ github.ref_name }}'
            docker buildx imagetools create \
              -t "$image:$version" \
              -t "$image:latest" \
              "$(printf '%s@sha256:%s ' "$image" *)"
          else
            branch='${{ github.ref_name }}'
            docker buildx imagetools create \
              -t "$image:$branch" \
              "$(printf '%s@sha256:%s ' "$image" *)"
          fi
        working-directory: ${{ runner.temp }}/digests

  cleanup:
    name: Cleanup Old Untagged Images
    runs-on: ubuntu-24.04
    needs: merge
    permissions:
      packages: write
    steps:
      - name: Lowercase package name
        id: vars
        run: echo "package_name=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - name: Delete old untagged container versions
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = '${{ steps.vars.outputs.package_name }}';
            const refType = context.ref?.startsWith("refs/tags/") ? "tag" : "branch";
            const refName = context.ref?.replace("refs/heads/", "").replace("refs/tags/", "") || "";
            const defaultKeep = Number(process.env.KEEP_UNTAGGED_COUNT || "3");
            const ownerType = context.payload.repository.owner.type;

            // Policy:
            // - tags: keep all
            // - main: keep KEEP_UNTAGGED_COUNT
            // - other branches: keep 1
            if (refType === "tag") {
              core.info(`Tag run (${refName}): skip untagged cleanup.`);
              return;
            }

            const keepUntagged = refName === "main" ? defaultKeep : 1;

            const listEndpoint = ownerType === "Organization"
              ? "GET /orgs/{org}/packages/{package_type}/{package_name}/versions"
              : "GET /users/{username}/packages/{package_type}/{package_name}/versions";

            const deleteEndpoint = ownerType === "Organization"
              ? "DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}"
              : "DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}";

            const listParams = ownerType === "Organization"
              ? { org: owner, package_type: "container", package_name: packageName, per_page: 100 }
              : { username: owner, package_type: "container", package_name: packageName, per_page: 100 };

            const versions = await github.paginate(listEndpoint, listParams);
            const untagged = versions
              .filter((v) => {
                const tags = v.metadata?.container?.tags || [];
                return tags.length === 0;
              })
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = untagged.slice(keepUntagged);
            core.info(`Branch run (${refName}): found ${untagged.length} untagged versions; keeping ${keepUntagged}, deleting ${toDelete.length}.`);

            for (const v of toDelete) {
              const deleteParams = ownerType === "Organization"
                ? { org: owner, package_type: "container", package_name: packageName, package_version_id: v.id }
                : { username: owner, package_type: "container", package_name: packageName, package_version_id: v.id };
              await github.request(deleteEndpoint, deleteParams);
              core.info(`Deleted untagged version id=${v.id}`);
            }
